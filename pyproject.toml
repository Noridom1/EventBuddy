[project]
name = "eventbuddy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "botbuilder-core>=4.16",
  "botbuilder-schema>=4.16",
  "botbuilder-integration-aiohttp>=4.16",  # provides CloudAdapter + auth classes
  "aiohttp>=3.9",  # botbuilder's async connector imports this at import time; not auto-pulled
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",            # ChatOpenAI for the tool-calling chat path (Phase 1.7)
  "langgraph-checkpoint-redis>=0.4",  # Redis checkpointer = conversation working window (Phase 1.7)
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "redis>=5.0",
  "apscheduler>=3.10",
  "openai>=1.40",
  "msal>=1.28",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pgvector>=0.3",
  "openpyxl>=3.1",        # .xlsx parsing for document ingestion (Impl 2)
  "python-docx>=1.1",     # .docx parsing for document ingestion (Impl 2)
  "pypdf>=4.0",           # .pdf parsing for document ingestion (Impl 2)
  "markdown>=3.5",        # render model-authored Markdown bodies → HTML for email/Teams sends
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "fakeredis>=2.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests that need Postgres/Redis from docker-compose"]
addopts = "-m 'not integration'"
